name: PhaseLabServer
version: 5.1.0
main: dev.denis.phaselab.server.PhaseLabServerPlugin
api-version: '1.21'
author: Denis + OpenAI
description: One-command bounded PhaseLab vehicle test harness with authoritative verdicts and rollback.
commands:
  phaselab:
    description: Start, inspect, or abort the PhaseLab test harness.
    usage: /phaselab <quickstart [seconds]|status|abort>
    permission: phaselab.admin
permissions:
  phaselab.admin:
    description: Operate the PhaseLab test harness.
    default: op
