name: PhaseLabServer
version: 6.0.0
main: dev.denis.phaselab.server.PhaseLabServerPlugin
api-version: '1.21'
author: Denis + OpenAI
description: Authorized bounded PhaseLab campaign referee with live-stack verdicts, evidence, and rollback.
commands:
  phaselab:
    description: Authorize, inspect, or abort the PhaseLab campaign.
    usage: /phaselab <quickstart [seconds]|status|abort>
    permission: phaselab.admin
permissions:
  phaselab.admin:
    description: Operate the authorized PhaseLab campaign.
    default: op
