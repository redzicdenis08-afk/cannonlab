name: Build MountLab SteerFlip

on:
  push:
    branches: [mountlab-steerflip-1.21.11]
    paths:
      - 'mountlab-client/**'
      - '.github/workflows/mountlab-steerflip-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build Fabric mod
        run: gradle -p mountlab-client build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mountlab-steerflip-1.21.11
          path: |
            mountlab-client/build/libs/mountlab-steerflip-*.jar
            !mountlab-client/build/libs/*-sources.jar
          if-no-files-found: error
