name: Build PhaseLab Player Active Tester

on:
  push:
    branches:
      - feature/phaselab-client
      - fix/phaselab-passive-telemetry-v4.1
      - fix/phaselab-admin-telemetry-v4.2
      - feature/phaselab-lablocked-v5
      - fix/phaselab-easy-v5.1
      - feat/phaselab-player-active-v5.2
    paths:
      - 'phaselab-client/**'
      - '.github/workflows/build-phaselab-client.yml'
  pull_request:
    paths:
      - 'phaselab-client/**'
      - '.github/workflows/build-phaselab-client.yml'
  workflow_dispatch:

concurrency:
  group: phaselab-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build client mod
        id: client_build
        working-directory: phaselab-client
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Verify bounded player-only client
        if: success()
        working-directory: phaselab-client
        shell: bash
        run: |
          JAR='build/libs/phaselab-client-5.2.0.jar'
          test -f "$JAR"
          jar tf "$JAR" | tee jar-contents.txt
          jar tf "$JAR" | grep -F 'dev/denis/phaselab/PhaseTelemetryClient.class'
          jar tf "$JAR" | grep -F 'dev/denis/phaselab/PhaseLabActiveClient.class'
          jar tf "$JAR" | grep -F 'dev/denis/phaselab/mixin/ClientPacketListenerMixin.class'
          ! jar tf "$JAR" | grep -F 'dev/denis/phaselab/PhaseLabLockedClient.class'
          ! jar tf "$JAR" | grep -F 'dev/denis/phaselab/net/LabMessagePayload.class'
          ! jar tf "$JAR" | grep -F 'dev/denis/phaselab/PhaseLabClient.class'
          ! jar tf "$JAR" | grep -F 'dev/denis/phaselab/BoatPhaseClient.class'
          unzip -p "$JAR" fabric.mod.json | tee built-fabric.mod.json
          grep -F '"version": "5.2.0"' built-fabric.mod.json
          grep -F 'dev.denis.phaselab.PhaseLabActiveClient' built-fabric.mod.json
          javap -classpath "$JAR" -p -v dev.denis.phaselab.PhaseLabActiveClient > active-client-javap.txt
          grep -F 'PRESS_FORWARD' active-client-javap.txt
          grep -F 'DISMOUNT_EDGE' active-client-javap.txt
          grep -F 'PHASELAB_ACTIVE_LATEST.csv' active-client-javap.txt
          grep -F 'LOCAL_REPRODUCED' active-client-javap.txt
          grep -F 'MAX_RUNTIME_TICKS' active-client-javap.txt
          ! grep -F 'ServerboundMoveVehiclePacket' active-client-javap.txt
          ! grep -F 'ServerboundMovePlayerPacket' active-client-javap.txt
          ! grep -F 'setPos' active-client-javap.txt
          ! grep -F 'absMoveTo' active-client-javap.txt
          ! grep -F 'teleportTo' active-client-javap.txt

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-player-v5.2-build-evidence
          path: |
            phaselab-client/build.log
            phaselab-client/jar-contents.txt
            phaselab-client/built-fabric.mod.json
            phaselab-client/active-client-javap.txt
          if-no-files-found: warn

      - name: Upload player JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-player-active-5.2.0-mc1.21.11
          path: phaselab-client/build/libs/phaselab-client-5.2.0.jar
          if-no-files-found: error
