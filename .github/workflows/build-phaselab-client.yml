name: Build PhaseLab Client

on:
  push:
    branches:
      - feature/phaselab-client
    paths:
      - 'phaselab-client/**'
      - '.github/workflows/build-phaselab-client.yml'
  pull_request:
    paths:
      - 'phaselab-client/**'
      - '.github/workflows/build-phaselab-client.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build client mod
        id: build
        working-directory: phaselab-client
        shell: bash
        run: |
          set -o pipefail
          gradle build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-build-log
          path: phaselab-client/build.log
          if-no-files-found: error

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-client-1.21.11
          path: phaselab-client/build/libs/phaselab-client-1.0.0.jar
          if-no-files-found: error
