name: Build PhaseLab ExtremeCraft Geometry

on:
  push:
    branches:
      - fix/phaselab-geometry-v6.2
    paths:
      - 'phaselab-client/**'
      - '.github/workflows/build-phaselab-client.yml'
  pull_request:
    paths:
      - 'phaselab-client/**'
      - '.github/workflows/build-phaselab-client.yml'
  workflow_dispatch:

concurrency:
  group: phaselab-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build geometry-aware client mod
        working-directory: phaselab-client
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Verify geometry validation and bounded player-only behavior
        if: success()
        working-directory: phaselab-client
        shell: bash
        run: |
          JAR='build/libs/phaselab-client-6.2.0.jar'
          test -f "$JAR"
          jar tf "$JAR" | tee jar-contents.txt
          jar tf "$JAR" | grep -F 'dev/denis/phaselab/PhaseTelemetryClient.class'
          jar tf "$JAR" | grep -F 'dev/denis/phaselab/PhaseLabActiveClient.class'
          jar tf "$JAR" | grep -F 'dev/denis/phaselab/mixin/ClientPacketListenerMixin.class'
          ! jar tf "$JAR" | grep -F 'dev/denis/phaselab/net/LabMessagePayload.class'
          ! jar tf "$JAR" | grep -F 'dev/denis/phaselab/PhaseLabLockedClient.class'
          ! jar tf "$JAR" | grep -F 'dev/denis/phaselab/BoatPhaseClient.class'
          unzip -p "$JAR" fabric.mod.json | tee built-fabric.mod.json
          grep -F '"version": "6.2.0"' built-fabric.mod.json
          grep -F 'PhaseLab ExtremeCraft Geometry' built-fabric.mod.json
          javap -classpath "$JAR" -p -v dev.denis.phaselab.PhaseLabActiveClient > active-client-javap.txt
          grep -F 'extremecraft.net' active-client-javap.txt
          grep -F 'INVALID HEIGHT' active-client-javap.txt
          grep -F 'target_vertical_overlap' active-client-javap.txt
          grep -F 'LATERAL_ESCAPE' active-client-javap.txt
          grep -F 'max_corridor_crossing_ticks' active-client-javap.txt
          grep -F 'PRESS_FORWARD_SHORT' active-client-javap.txt
          grep -F 'AUTO_DEEP_SWEEP' active-client-javap.txt
          grep -F 'PHASELAB_EXTREMECRAFT_LATEST.csv' active-client-javap.txt
          grep -F 'MAX_RUNTIME_TICKS' active-client-javap.txt
          ! grep -F 'ServerboundMoveVehiclePacket' active-client-javap.txt
          ! grep -F 'ServerboundMovePlayerPacket' active-client-javap.txt
          ! grep -F 'setPos' active-client-javap.txt
          ! grep -F 'absMoveTo' active-client-javap.txt
          ! grep -F 'teleportTo' active-client-javap.txt
          ! grep -F 'setDeltaMovement' active-client-javap.txt
          ! grep -F 'noPhysics' active-client-javap.txt
          ! grep -F 'ClientPlayNetworking' active-client-javap.txt

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-extremecraft-geometry-v6.2-build-evidence
          path: |
            phaselab-client/build.log
            phaselab-client/jar-contents.txt
            phaselab-client/built-fabric.mod.json
            phaselab-client/active-client-javap.txt
          if-no-files-found: warn

      - name: Upload geometry-aware player JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-extremecraft-geometry-6.2.0-mc1.21.11
          path: phaselab-client/build/libs/phaselab-client-6.2.0.jar
          if-no-files-found: error
