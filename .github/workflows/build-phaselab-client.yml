name: Build PhaseLab ExtremeCraft Campaign

on:
  push:
    branches:
      - fix/phaselab-geometry-v6.2
    paths:
      - 'phaselab-client/**'
      - '.github/workflows/build-phaselab-client.yml'
  pull_request:
    paths:
      - 'phaselab-client/**'
      - '.github/workflows/build-phaselab-client.yml'
  workflow_dispatch:

concurrency:
  group: phaselab-player-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build campaign client mod
        working-directory: phaselab-client
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Verify campaign and bounded player-only behavior
        if: success()
        working-directory: phaselab-client
        shell: bash
        run: |
          JAR='build/libs/phaselab-client-6.3.0.jar'
          test -f "$JAR"
          jar tf "$JAR" | tee jar-contents.txt
          jar tf "$JAR" | grep -F 'dev/denis/phaselab/PhaseTelemetryClient.class'
          jar tf "$JAR" | grep -F 'dev/denis/phaselab/PhaseLabActiveClient.class'
          jar tf "$JAR" | grep -F 'dev/denis/phaselab/PhaseLabCampaignClient.class'
          jar tf "$JAR" | grep -F 'dev/denis/phaselab/mixin/ClientPacketListenerMixin.class'
          ! jar tf "$JAR" | grep -F 'dev/denis/phaselab/net/LabMessagePayload.class'
          ! jar tf "$JAR" | grep -F 'dev/denis/phaselab/PhaseLabLockedClient.class'
          ! jar tf "$JAR" | grep -F 'dev/denis/phaselab/BoatPhaseClient.class'
          unzip -p "$JAR" fabric.mod.json | tee built-fabric.mod.json
          grep -F '"version": "6.3.0"' built-fabric.mod.json
          grep -F 'PhaseLab ExtremeCraft Campaign' built-fabric.mod.json
          javap -classpath "$JAR" -p -v dev.denis.phaselab.PhaseLabActiveClient > active-client-javap.txt
          javap -classpath "$JAR" -p -v dev.denis.phaselab.PhaseLabCampaignClient > campaign-client-javap.txt
          grep -F 'extremecraft.net' campaign-client-javap.txt
          grep -F 'FULL_PRESSURE_MATRIX' campaign-client-javap.txt
          grep -F 'PULSE_STRESS' campaign-client-javap.txt
          grep -F 'STEERING_STRESS' campaign-client-javap.txt
          grep -F 'BRAKE_REVERSAL' campaign-client-javap.txt
          grep -F 'FORWARD_BACK_STRESS' campaign-client-javap.txt
          grep -F 'CAMPAIGN_CANDIDATE' campaign-client-javap.txt
          grep -F 'LATERAL_ESCAPE' campaign-client-javap.txt
          grep -F 'PHASELAB_CAMPAIGN_LATEST.csv' campaign-client-javap.txt
          ! grep -F 'ServerboundMoveVehiclePacket' campaign-client-javap.txt
          ! grep -F 'ServerboundMovePlayerPacket' campaign-client-javap.txt
          ! grep -F 'setPos' campaign-client-javap.txt
          ! grep -F 'absMoveTo' campaign-client-javap.txt
          ! grep -F 'teleportTo' campaign-client-javap.txt
          ! grep -F 'setDeltaMovement' campaign-client-javap.txt
          ! grep -F 'noPhysics' campaign-client-javap.txt
          ! grep -F 'ClientPlayNetworking' campaign-client-javap.txt

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-extremecraft-campaign-v6.3-build-evidence
          path: |
            phaselab-client/build.log
            phaselab-client/jar-contents.txt
            phaselab-client/built-fabric.mod.json
            phaselab-client/active-client-javap.txt
            phaselab-client/campaign-client-javap.txt
          if-no-files-found: warn

      - name: Upload campaign player JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-extremecraft-campaign-6.3.0-mc1.21.11
          path: phaselab-client/build/libs/phaselab-client-6.3.0.jar
          if-no-files-found: error
