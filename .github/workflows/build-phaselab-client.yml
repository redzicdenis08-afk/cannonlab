name: Build PhaseLab Client

on:
  push:
    branches:
      - feature/phaselab-client
      - research/phaselab-op-phase-dupe-v2
      - feat/phaselab-client-4.3-simple
      - feat/phaselab-client-4.5-smart
      - feat/phaselab-client-4.8-adaptive
      - feat/phaselab-client-5.1-pulse
      - feat/phaselab-client-5.2-verifier
    paths:
      - 'phaselab-client/**'
      - '.github/workflows/build-phaselab-client.yml'
  pull_request:
    paths:
      - 'phaselab-client/**'
      - '.github/workflows/build-phaselab-client.yml'
  workflow_dispatch:

concurrency:
  group: phaselab-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build client mod
        id: build
        working-directory: phaselab-client
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Verify built JAR contents
        if: success()
        working-directory: phaselab-client
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'phaselab-client-5.2.0.jar' -print -quit)"
          test -n "$JAR"
          jar tf "$JAR" | tee jar-contents.txt
          python - "$JAR" <<'PY'
          import json
          import sys
          import zipfile

          jar = sys.argv[1]
          required = {
              'dev/denis/phaselab/BoatPhaseClient.class',
              'dev/denis/phaselab/mixin/ClientPacketListenerMixin.class',
              'phaselab.client.mixins.json',
              'assets/phaselab/lang/en_us.json',
              'fabric.mod.json',
          }
          with zipfile.ZipFile(jar) as zf:
              names = set(zf.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'missing JAR entries: {missing}')
              mod = json.loads(zf.read('fabric.mod.json'))
          if mod.get('version') != '5.2.0':
              raise SystemExit(f"wrong mod version: {mod.get('version')!r}")
          client_entrypoints = mod.get('entrypoints', {}).get('client', [])
          if client_entrypoints != ['dev.denis.phaselab.BoatPhaseClient']:
              raise SystemExit(f'wrong client entrypoints: {client_entrypoints!r}')
          if mod.get('depends', {}).get('minecraft') != '~1.21.11':
              raise SystemExit('wrong Minecraft dependency')
          print(json.dumps({'jar': jar, 'version': mod['version'], 'verified_entries': len(required)}, sort_keys=True))
          PY
          unzip -p "$JAR" fabric.mod.json | tee built-fabric.mod.json
          javap -classpath "$JAR" -p dev.denis.phaselab.BoatPhaseClient | tee boat-phase-javap.txt
          grep -F 'BOAT_FORWARD_PROFILES' boat-phase-javap.txt
          grep -F 'BOAT_DOWN_PROFILES' boat-phase-javap.txt
          grep -F 'HORSE_FORWARD_PROFILES' boat-phase-javap.txt
          grep -F 'HORSE_DOWN_PROFILES' boat-phase-javap.txt
          grep -F 'MANUAL_REMOUNT_WINDOW_TICKS' boat-phase-javap.txt
          grep -F 'REMOUNT_STABLE_TICKS' boat-phase-javap.txt
          grep -F 'onServerPlayerCorrectionHead' boat-phase-javap.txt
          grep -F 'onServerPlayerCorrectionTail' boat-phase-javap.txt
          grep -F 'onServerVehicleCorrectionHead' boat-phase-javap.txt
          grep -F 'onServerVehicleCorrectionTail' boat-phase-javap.txt
          if jar tf "$JAR" | grep -Eq 'PhaseLabClient.class|PhaseTelemetryClient.class'; then
            echo 'stale client engine found in verifier JAR' >&2
            exit 1
          fi

      - name: Publish compact client verdict
        if: success() && github.event_name == 'push'
        working-directory: phaselab-client
        shell: bash
        run: |
          set -euo pipefail
          JAR='build/libs/phaselab-client-5.2.0.jar'
          SHA="$(sha256sum "$JAR" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$JAR")"
          mkdir -p ../phaselab-evidence
          cat > ../phaselab-evidence/latest-client-build.json <<EOF
          {"version":"5.2.0","minecraft":"1.21.11","artifact":"phaselab-client-5.2.0.jar","sha256":"$SHA","bytes":$SIZE,"client_only":true,"single_entrypoint":true,"bounded_one_profile_per_press":true,"profile_ladders":{"boat_forward":6,"boat_down":5,"horse_forward":6,"horse_down":4},"step":0.25,"correction_head_tail":true,"tick_snapshots":true,"environment_snapshots":true,"manual_remount_window_ticks":120,"remount_stable_ticks":20,"auto_remount":false,"continuous_phase":false,"default_test_key":"P","default_abort_key":"O","verified":true}
          EOF
          cd ..
          git config user.name 'phaselab-bot'
          git config user.email 'phaselab-bot@users.noreply.github.com'
          git add phaselab-evidence/latest-client-build.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record latest PhaseLab client build [skip ci]'
          git push

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-build-log-v5.2
          path: |
            phaselab-client/build.log
            phaselab-client/jar-contents.txt
            phaselab-client/built-fabric.mod.json
            phaselab-client/boat-phase-javap.txt
          if-no-files-found: warn

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-client-5.2.0-mc1.21.11
          path: phaselab-client/build/libs/phaselab-client-5.2.0.jar
          if-no-files-found: error
