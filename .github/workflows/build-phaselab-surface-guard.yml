name: Build PhaseLab SurfaceGuard

on:
  push:
    branches:
      - research/phaselab-mixed-course
    paths:
      - 'phaselab-surface-guard/**'
      - '.github/workflows/build-phaselab-surface-guard.yml'
  pull_request:
    paths:
      - 'phaselab-surface-guard/**'
      - '.github/workflows/build-phaselab-surface-guard.yml'
  workflow_dispatch:

concurrency:
  group: phaselab-surface-guard-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build SurfaceGuard
        working-directory: phaselab-surface-guard
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Verify SurfaceGuard JAR
        working-directory: phaselab-surface-guard
        shell: bash
        run: |
          JAR='build/libs/PhaseLab-SurfaceGuard-1.0.0.jar'
          test -f "$JAR"
          jar tf "$JAR" | tee jar-contents.txt
          jar tf "$JAR" | grep -F 'dev/denis/phaselab/surface/SurfaceGuardPlugin.class'
          unzip -p "$JAR" plugin.yml | tee built-plugin.yml
          grep -F 'name: PhaseLabSurfaceGuard' built-plugin.yml
          grep -F 'version: 1.0.0' built-plugin.yml

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-surface-guard-build
          path: |
            phaselab-surface-guard/build.log
            phaselab-surface-guard/jar-contents.txt
            phaselab-surface-guard/built-plugin.yml
            phaselab-surface-guard/build/libs/PhaseLab-SurfaceGuard-1.0.0.jar
          if-no-files-found: warn
