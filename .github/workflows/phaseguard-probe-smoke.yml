name: PhaseGuard Probe Smoke

on:
  push:
    branches:
      - feat/phaselab-client-5.1-pulse
      - feat/phaseguard-server-probe
    paths:
      - 'phaselab-server-probe/**'
      - 'phaselab-private-stack-fixture/**'
      - 'phaselab-harness/phaseguard-probe-smoke.js'
      - 'phaselab-harness/package.json'
      - '.github/workflows/phaseguard-probe-smoke.yml'
  workflow_dispatch:

concurrency:
  group: phaseguard-probe-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-sakura-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: phaselab-harness/package.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Install headless client
        working-directory: phaselab-harness
        run: npm install --no-audit --no-fund

      - name: Build fixture and probe
        run: |
          set -euxo pipefail
          gradle -p phaselab-private-stack-fixture clean build --stacktrace --console=plain
          gradle -p phaselab-server-probe clean build --stacktrace --console=plain

      - name: Build FactionsUUID 4.6.1 candidate
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch 4.6.1 https://github.com/FactionsU/UID.git phaselab-factionsuuid
          chmod +x phaselab-factionsuuid/gradlew
          ./phaselab-factionsuuid/gradlew -p phaselab-factionsuuid clean build --no-daemon --stacktrace --console=plain
          test -f phaselab-factionsuuid/paper/build/libs/factionsuuid.jar

      - name: Restore pinned Sakura paperclip
        id: sakura-cache
        uses: actions/cache/restore@v4
        with:
          path: phaselab-cache/server.jar
          key: sakura-paperclip-63f35d74e0fbe6bcd76c58494c01c1632c83010d-java25-v1

      - name: Build pinned Sakura 26.1.2
        if: steps.sakura-cache.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          mkdir -p phaselab-cache
          git clone --filter=blob:none https://github.com/Samsuik/Sakura.git sakura-source
          cd sakura-source
          git checkout 63f35d74e0fbe6bcd76c58494c01c1632c83010d
          ./gradlew applyAllPatches --no-daemon --stacktrace --console=plain
          ./gradlew createPaperclipJar --no-daemon --stacktrace --console=plain
          SERVER_JAR="$(find . -path '*/build/libs/*paperclip*.jar' -type f | sort | tail -n 1)"
          test -n "$SERVER_JAR"
          cp "$SERVER_JAR" ../phaselab-cache/server.jar

      - name: Save pinned Sakura paperclip
        if: steps.sakura-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: phaselab-cache/server.jar
          key: sakura-paperclip-63f35d74e0fbe6bcd76c58494c01c1632c83010d-java25-v1

      - name: Assemble exact smoke runtime
        run: |
          set -euxo pipefail
          mkdir -p phaseguard-runtime/plugins
          cp phaselab-cache/server.jar phaseguard-runtime/server.jar
          cp phaselab-factionsuuid/paper/build/libs/factionsuuid.jar phaseguard-runtime/plugins/FactionsUUID-4.6.1.jar
          cp phaselab-private-stack-fixture/build/libs/StackLab-Fixture-1.0.0.jar phaseguard-runtime/plugins/
          cp phaselab-server-probe/build/libs/PhaseGuard-Probe-1.0.0.jar phaseguard-runtime/plugins/
          curl -fL https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar -o phaseguard-runtime/plugins/Vault-1.7.3.jar

          sha256sum phaseguard-runtime/server.jar > phaseguard-runtime/server.sha256
          sha256sum phaseguard-runtime/plugins/*.jar | sort > phaseguard-runtime/plugins.sha256

          cat > phaseguard-runtime/eula.txt <<'EOF'
          eula=true
          EOF
          cat > phaseguard-runtime/server.properties <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          server-ip=127.0.0.1
          server-port=25566
          gamemode=survival
          difficulty=peaceful
          spawn-protection=0
          level-name=world
          level-type=minecraft:flat
          generate-structures=false
          view-distance=6
          simulation-distance=6
          max-players=8
          allow-flight=true
          enable-rcon=false
          white-list=false
          motd=PhaseGuard exact smoke
          EOF
          cat > phaseguard-runtime/ops.json <<'EOF'
          [
            {
              "uuid": "0c88e2e5-4a6f-3398-adba-5d004a77e35d",
              "name": "PhaseBot",
              "level": 4,
              "bypassesPlayerLimit": true
            }
          ]
          EOF

      - name: Run exact probe smoke
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          RUNTIME="$GITHUB_WORKSPACE/phaseguard-runtime"
          HARNESS="$GITHUB_WORKSPACE/phaselab-harness"
          cd "$RUNTIME"
          rm -f server.in
          mkfifo server.in
          tail -f server.in | java -Xms1G -Xmx3G -jar server.jar nogui > server.log 2>&1 &
          SERVER_PIPE_PID=$!
          exec 3>server.in

          cleanup() {
            printf 'stop\n' >&3 2>/dev/null || true
            sleep 5
            kill "$SERVER_PIPE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 300); do
            if grep -q 'Done (' server.log; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PIPE_PID" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 2
          done
          test "$READY" -eq 1

          cd "$HARNESS"
          rm -rf output-phaseguard-smoke
          PHASELAB_HOST=127.0.0.1 PHASELAB_PORT=25566 PHASELAB_OUTPUT="$HARNESS/output-phaseguard-smoke"             node phaseguard-probe-smoke.js 2>&1 | tee "$RUNTIME/harness.log"
          EXIT_CODE=${PIPESTATUS[0]}
          printf '%s\n' "$EXIT_CODE" > "$RUNTIME/smoke.exit"
          sleep 3
          exit "$EXIT_CODE"

      - name: Verify server-authoritative evidence
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path('phaselab-harness/output-phaseguard-smoke/phaseguard-smoke-report.json')
          if not report_path.exists():
              raise SystemExit('missing smoke report')
          report = json.loads(report_path.read_text())
          if report.get('fatal'):
              raise SystemExit(report['fatal'])

          sessions = sorted(Path('phaseguard-runtime/plugins/PhaseGuardProbe/sessions').glob('*.jsonl'))
          if not sessions:
              raise SystemExit('no PhaseGuard session JSONL produced')
          rows = [json.loads(line) for line in sessions[-1].read_text().splitlines() if line.strip()]
          types = {row.get('type') for row in rows}
          required = {'session_start', 'probe_tick', 'event_priority_stage', 'probe_transition', 'manual_snapshot', 'listener_map', 'session_stop'}
          missing = sorted(required - types)
          if missing:
              raise SystemExit(f'missing evidence types: {missing}')

          ticks = [row for row in rows if row.get('type') == 'probe_tick']
          if len(ticks) < 20:
              raise SystemExit(f'not enough tick samples: {len(ticks)}')
          states = [row.get('state', {}) for row in ticks]
          for field in ['player_claim', 'player_collision_signature', 'mounted']:
              if not any(field in state for state in states):
                  raise SystemExit(f'missing state field: {field}')
          if not any(state.get('vehicle_collision_signature') for state in states):
              raise SystemExit('vehicle collision state never captured')

          priorities = {row.get('priority') for row in rows if row.get('type') == 'event_priority_stage'}
          expected_priorities = {'LOWEST', 'LOW', 'NORMAL', 'HIGH', 'HIGHEST', 'MONITOR'}
          if not expected_priorities.issubset(priorities):
              raise SystemExit(f'priority coverage incomplete: {sorted(priorities)}')

          claims = {state.get('player_claim') for state in states}
          print({
              'session': str(sessions[-1]),
              'rows': len(rows),
              'ticks': len(ticks),
              'types': sorted(types),
              'priorities': sorted(priorities),
              'player_claims': sorted(str(value) for value in claims),
              'verified': True,
          })
          PY

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaseguard-probe-exact-smoke
          if-no-files-found: warn
          path: |
            phaseguard-runtime/server.log
            phaseguard-runtime/harness.log
            phaseguard-runtime/smoke.exit
            phaseguard-runtime/server.sha256
            phaseguard-runtime/plugins.sha256
            phaseguard-runtime/plugins/PhaseGuardProbe/sessions/*.jsonl
            phaselab-harness/output-phaseguard-smoke/phaseguard-smoke-report.json
            phaselab-harness/output-phaseguard-smoke/phaseguard-smoke-transcript.jsonl
