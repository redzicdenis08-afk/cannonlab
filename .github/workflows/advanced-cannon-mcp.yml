name: Advanced Cannon MCP

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'CANNONLAB_START_HERE.md'
      - 'mcp-server/**'
      - 'scripts/cannon-ratio-audit.py'
      - 'scripts/analyze-impulse-graph.py'
      - 'scripts/classify-cannon-run.py'
      - 'scripts/verify-sakura-cannon-contract.py'
      - 'scripts/cannon-synthesis-planner.py'
      - 'scripts/promote-cannon-component.py'
      - 'scripts/generate-causal-repair-family.py'
      - 'scripts/run-cannon-campaign.py'
      - 'scripts/plan-extremecraft-raid-program.py'
      - 'scripts/test-extremecraft-raid-program.py'
      - 'profiles/ratios/**'
      - 'profiles/parity/**'
      - 'profiles/grammar/**'
      - 'profiles/raid/**'
      - 'profiles/archetypes/**'
      - 'profiles/synthesis/**'
      - 'profiles/components/**'
      - 'profiles/repairs/**'
      - 'profiles/campaigns/**'
      - '.github/workflows/advanced-cannon-mcp.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  advanced-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile advanced MCP
        run: |
          python -m py_compile \
            mcp-server/advanced_tools.py \
            mcp-server/handoff_tools.py \
            mcp-server/raid_tools.py \
            mcp-server/advanced_server.py \
            mcp-server/test-advanced-tools.py \
            mcp-server/test-handoff-tools.py \
            scripts/classify-cannon-run.py \
            scripts/verify-sakura-cannon-contract.py \
            scripts/plan-extremecraft-raid-program.py \
            scripts/test-extremecraft-raid-program.py

      - name: Run command, path, handoff and raid regressions
        run: |
          python mcp-server/test-advanced-tools.py
          python mcp-server/test-handoff-tools.py
          python scripts/test-extremecraft-raid-program.py

      - name: Install MCP package
        run: python -m pip install -e mcp-server

      - name: Verify real FastMCP registry
        run: |
          python - <<'PY'
          import asyncio
          import advanced_server

          expected = {
              'get_cannonlab_handoff',
              'plan_extremecraft_raid_program',
              'audit_cannon_ratio',
              'analyze_impulse_graph',
              'classify_cannon_failure',
              'verify_sakura_cannon_contract',
              'plan_cannon_synthesis',
              'promote_cannon_component',
              'generate_causal_repair_family',
              'run_cannon_campaign',
              'list_advanced_cannon_profiles',
          }
          tools = asyncio.run(advanced_server.mcp.list_tools())
          names = {tool.name for tool in tools}
          assert expected <= names, {'missing': sorted(expected - names), 'available': sorted(names)}
          assert set(advanced_server.REGISTERED_ADVANCED_TOOLS) == expected
          print(f'FastMCP registered {len(names)} total tools including all eleven advanced tools.')
          PY

      - name: Execute real advanced, handoff and raid tools through production registry
        run: |
          python - <<'PY'
          import asyncio
          import advanced_server

          script = advanced_server.base.SCRIPTS / 'cannon-ratio-audit.py'
          profile = (
              advanced_server.base.ROOT
              / 'profiles/ratios/public-0.7-384-osrb-1-above-barrel.json'
          )
          report = advanced_server._advanced_run_json(
              script,
              [str(profile)],
              allowed_exit_codes=(0, 2),
          )
          assert report['_exit_code'] in (0, 2), report
          assert report['truth_boundary']['runtime_physics_confirmed'] is False, report
          assert report['truth_boundary']['private_server_parity_confirmed'] is False, report

          tools = {tool.name: tool for tool in asyncio.run(advanced_server.mcp.list_tools())}
          handoff = asyncio.run(
              advanced_server.mcp.call_tool('get_cannonlab_handoff', {'include_documents': False})
          )
          handoff_text = str(handoff)
          assert 'grammar_modules' in handoff_text and 'private_parity_dimensions' in handoff_text, handoff_text
          assert 'field_ready_advanced_extremecraft_cannon_exists' in handoff_text, handoff_text

          raid = asyncio.run(
              advanced_server.mcp.call_tool('plan_extremecraft_raid_program', {})
          )
          raid_text = str(raid)
          assert 'fifteen_chunk_raid_capability' in raid_text, raid_text
          assert 'buffer_depth_is_projectile_distance' in raid_text, raid_text
          assert 'BLOCKED' in raid_text, raid_text
          print('Production registry executed ratio, handoff and fail-closed raid planning tools.')
          PY

      - name: Capture advanced tool inventory
        run: |
          mkdir -p lab-artifacts/advanced-cannon-mcp
          python - <<'PY'
          import asyncio
          import json
          from pathlib import Path
          import advanced_server

          tools = asyncio.run(advanced_server.mcp.list_tools())
          payload = {
              'schema_version': 4,
              'tool_count': len(tools),
              'tools': sorted(tool.name for tool in tools),
              'advanced_tools': sorted(advanced_server.REGISTERED_ADVANCED_TOOLS),
              'production_runner_adapter': True,
              'handoff_tool': 'get_cannonlab_handoff',
              'raid_program_tool': 'plan_extremecraft_raid_program',
              'bounded_campaign_tool': 'run_cannon_campaign',
              'causal_failure_tool': 'classify_cannon_failure',
              'sakura_contract_tool': 'verify_sakura_cannon_contract',
          }
          Path('lab-artifacts/advanced-cannon-mcp/tools.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload MCP inventory
        uses: actions/upload-artifact@v4
        with:
          name: advanced-cannon-mcp
          path: lab-artifacts/advanced-cannon-mcp
          if-no-files-found: error
