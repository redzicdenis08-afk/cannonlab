name: PhaseLab Headless Exact Sakura

on:
  push:
    branches:
      - feature/phaselab-client
    paths:
      - 'phaselab-harness/**'
      - '.github/workflows/phaselab-headless-sakura.yml'
  pull_request:
    paths:
      - 'phaselab-harness/**'
      - '.github/workflows/phaselab-headless-sakura.yml'
  workflow_dispatch:

jobs:
  exact-sakura-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout CannonLab
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: phaselab-harness/package.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install headless client
        working-directory: phaselab-harness
        run: npm install --no-audit --no-fund

      - name: Build pinned Sakura 26.1.2
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p phaselab-runtime
          git config --global user.name 'PhaseLab CI'
          git config --global user.email 'phaselab-ci@users.noreply.github.com'
          git clone --filter=blob:none https://github.com/Samsuik/Sakura.git sakura-source
          cd sakura-source
          git checkout 63f35d74e0fbe6bcd76c58494c01c1632c83010d
          ./gradlew applyAllPatches --no-daemon --stacktrace 2>&1 | tee ../phaselab-runtime/sakura-apply-patches.log
          ./gradlew createPaperclipJar --no-daemon --stacktrace 2>&1 | tee ../phaselab-runtime/sakura-build.log
          mkdir -p ../phaselab-runtime/plugins
          SERVER_JAR="$(find . -path '*/build/libs/*paperclip*.jar' -type f | sort | tail -n 1)"
          test -n "$SERVER_JAR"
          cp "$SERVER_JAR" ../phaselab-runtime/server.jar
          sha256sum ../phaselab-runtime/server.jar | tee ../phaselab-runtime/sakura-server.sha256

      - name: Install ViaVersion and ViaBackwards 5.9.0
        shell: bash
        run: |
          set -euxo pipefail
          VV_JSON="$(curl -fsSL https://api.modrinth.com/v2/version/I0mCQX6z)"
          VV_URL="$(printf '%s' "$VV_JSON" | jq -r '.files[] | select(.primary == true) | .url' | head -n 1)"
          VB_JSON="$(curl -fsSL https://api.modrinth.com/v2/version/HDbyDR7L)"
          VB_URL="$(printf '%s' "$VB_JSON" | jq -r '.files[] | select(.primary == true) | .url' | head -n 1)"
          test -n "$VV_URL"
          test -n "$VB_URL"
          curl -fL "$VV_URL" -o phaselab-runtime/plugins/ViaVersion.jar
          curl -fL "$VB_URL" -o phaselab-runtime/plugins/ViaBackwards.jar
          sha256sum phaselab-runtime/plugins/ViaVersion.jar | tee phaselab-runtime/viaversion.sha256
          sha256sum phaselab-runtime/plugins/ViaBackwards.jar | tee phaselab-runtime/viabackwards.sha256

      - name: Run exact Sakura movement matrix
        id: matrix
        shell: bash
        run: |
          set -o pipefail
          RUNTIME="$GITHUB_WORKSPACE/phaselab-runtime"
          HARNESS="$GITHUB_WORKSPACE/phaselab-harness"
          mkdir -p "$RUNTIME/output"

          cat > "$RUNTIME/eula.txt" <<'EOF'
          eula=true
          EOF

          cat > "$RUNTIME/server.properties" <<'EOF'
          online-mode=false
          enforce-secure-profile=false
          server-port=25565
          server-ip=127.0.0.1
          gamemode=survival
          difficulty=peaceful
          spawn-protection=0
          level-name=phaselab
          level-type=minecraft:flat
          generate-structures=false
          view-distance=5
          simulation-distance=5
          max-players=4
          enable-rcon=false
          enable-query=false
          motd=PhaseLab exact Sakura
          EOF

          cd "$RUNTIME"
          rm -f server.in
          mkfifo server.in
          tail -f server.in | java -Xms1G -Xmx3G -jar server.jar nogui > server.log 2>&1 &
          SERVER_PIPE_PID=$!
          exec 3>server.in

          cleanup() {
            printf 'stop\n' >&3 2>/dev/null || true
            sleep 5
            kill "$SERVER_PIPE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for _ in $(seq 1 300); do
            if grep -q 'Done (' server.log; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PIPE_PID" 2>/dev/null; then
              echo 'Server process exited early'
              cat server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Timed out waiting for Sakura startup'
            cat server.log
            exit 1
          fi

          printf 'gamerule spawnRadius 0\n' >&3
          printf 'gamerule doDaylightCycle false\n' >&3
          printf 'time set day\n' >&3
          printf 'setworldspawn 0 65 0\n' >&3
          printf 'fill -2 64 -2 10 64 2 minecraft:stone\n' >&3
          printf 'fill 1 65 -1 1 67 1 minecraft:obsidian\n' >&3
          printf 'fill 2 65 -1 7 67 1 minecraft:air\n' >&3
          printf 'setblock 8 65 0 minecraft:barrel[facing=west]\n' >&3
          printf 'op PhaseBot\n' >&3
          sleep 4

          cd "$HARNESS"
          PHASELAB_HOST=127.0.0.1 \
          PHASELAB_PORT=25565 \
          PHASELAB_USERNAME=PhaseBot \
          PHASELAB_OUTPUT="$RUNTIME/output" \
          npm test 2>&1 | tee "$RUNTIME/harness.log"
          HARNESS_STATUS=${PIPESTATUS[0]}

          echo '--- report.csv ---'
          cat "$RUNTIME/output/report.csv" || true
          exit "$HARNESS_STATUS"

      - name: Upload exact-runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-headless-exact-sakura
          path: |
            phaselab-runtime/output/report.json
            phaselab-runtime/output/report.csv
            phaselab-runtime/harness.log
            phaselab-runtime/server.log
            phaselab-runtime/sakura-apply-patches.log
            phaselab-runtime/sakura-build.log
            phaselab-runtime/sakura-server.sha256
            phaselab-runtime/viaversion.sha256
            phaselab-runtime/viabackwards.sha256
          if-no-files-found: warn
