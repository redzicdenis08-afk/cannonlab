name: Build PhaseLab Defense Course

on:
  push:
    branches:
      - research/phaselab-mixed-course
    paths:
      - 'phaselab-defense-course/**'
      - '.github/workflows/build-phaselab-defense-course.yml'
  workflow_dispatch:

concurrency:
  group: phaselab-defense-course-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build defense course
        working-directory: phaselab-defense-course
        shell: bash
        run: |
          set -o pipefail
          gradle clean build --stacktrace --console=plain 2>&1 | tee build.log
      - name: Verify defense course JAR
        working-directory: phaselab-defense-course
        shell: bash
        run: |
          JAR='build/libs/PhaseLab-DefenseCourse-1.0.0.jar'
          test -f "$JAR"
          jar tf "$JAR" | tee jar-contents.txt
          jar tf "$JAR" | grep -F 'dev/denis/phaselab/course/DefenseCoursePlugin.class'
          unzip -p "$JAR" plugin.yml | tee built-plugin.yml
          grep -F 'name: PhaseLabDefenseCourse' built-plugin.yml
          grep -F 'version: 1.0.0' built-plugin.yml
      - name: Upload defense course build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phaselab-defense-course-build
          path: |
            phaselab-defense-course/build.log
            phaselab-defense-course/jar-contents.txt
            phaselab-defense-course/built-plugin.yml
            phaselab-defense-course/build/libs/PhaseLab-DefenseCourse-1.0.0.jar
          if-no-files-found: warn
